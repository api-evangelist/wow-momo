x-operator: >-
  restaurants.wowmomo.com is a store-locator microsite served by a third-party location-marketing SaaS
  platform (its assets load from /VendorpageTheme/Enterprise/... and /files/public/261129/), operating
  under the WOW! Momo brand rather than from WOW! Momo's own stack, so it is not registered as a WOW!
  Momo API. The Wow Eats consumer ordering app (com.wowmomo.woweats) was built for WOW! Momo by
  BlueHorse Software; its backend answers on api.wowmomo.com, which is a WOW! Momo domain.
