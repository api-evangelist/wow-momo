x-enrichment-notes: >-
  Deliberately absent, each a verified negative probed on 2026-09-04. WellKnown and SecurityTxt: every
  named /.well-known path plus /apis.json, /apis.yml and /llms.txt returned 404 on www.wowmomo.com and
  wowmomo.com; api.wowmomo.com returned HTTP 200 for all of them, but a negative-control path that cannot
  exist returned the identical NO_AUTH body, so none of those 200s is a document. The probe is recorded
  in well-known/wow-momo-well-known.yml with NO pointer. AgentCard: /.well-known/agent-card.json and
  /.well-known/agent.json miss on every host, so nothing was written. MCPServer: no server exists
  anywhere; the derived tool list carries X-MCPServerCandidate, never MCPServer. The install does declare
  two MCP-adjacent routes — wp-abilities/v1 (401) and hfe/v1/mcp-abilities (403) — and both arrived with
  WordPress core and an Elementor plugin, not with any WOW! Momo decision. SDKs and CLI: nothing on npm,
  PyPI or any registry, and no WOW! Momo GitHub organisation exists, so no SDKs pointer is emitted.
  Idempotency: no replay-protection contract exists on either surface, so no Idempotency pointer is
  emitted. StatusPage and Deprecation: no status host is served (status.wowmomo.com answers only through
  a wildcard DNS record and fails TLS, exactly as a control subdomain does) and no deprecation policy or
  RFC 8594 header exists, so Lifecycle carries neither companion pointer. Security, VulnerabilityDisclosure,
  TrustCenter and Compliance: no security.txt, no disclosure policy, no bug bounty and no certification
  or trust page — probe-security-programs.py returned vdp=none trust=none, so nothing was written.
  AsyncAPI and Webhooks: /asyncapi.yaml, /asyncapi.json, /events and /webhooks all miss on both hosts.
  Protobuf and WSDL: ?wsdl and ?singleWsdl miss on both hosts. Sandbox, Changelog, Components,
  DeclineCodes, OAuthScopes, Postman and Roadmap: none published. DeveloperPortal, Documentation,
  APIReference, GettingStarted and Support: WOW! Momo runs no developer programme at all, so none of
  these pages exists to point at — the only contact address published anywhere on the site is
  info@wowmomo.co.in, on the privacy page. The harvest stub's original Website pointer was
  https://www.nasdaqprivatemarket.com/, the secondary-market venue rather than the company; it has been
  replaced with https://www.wowmomo.com/ and no venue pointer is emitted, because the venue publishes no
  WOW! Momo-specific page. ContentSignal: well-known/wow-momo-robots.txt is saved as evidence but carries
  NO pointer — it declares "User-agent: * / Disallow:" with no Content Signals policy and no AI-crawler
  rule.
