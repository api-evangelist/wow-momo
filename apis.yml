- aid: wow-momo:wow-momo-app-backend
  name: WOW! Momo App Backend
  description: >-
    A first-party application backend on api.wowmomo.com behind an AWS Application Load Balancer,
    running an Express service scaffolded with DhiWise (its root serves a "welcome to node.js" page
    carrying the DhiWise logo, with a commented-out link to /swagger). It serves the Wow Eats consumer
    ordering app. Every path probed anonymously on 2026-09-04 — including /openapi.json, /swagger,
    /graphql, /mcp and a control path that cannot exist — returned an identical HTTP 200 body
    {"data":null,"message":"NO_AUTH","messageType":"FAILED"}, so no contract, path list or
    documentation is observable without a credential. Only GET /health answers, with "OK".
  image: https://www.wowmomo.com/wp-content/uploads/2022/03/Wow-Momo-Logo.png
  humanURL: https://api.wowmomo.com/
  baseURL: https://api.wowmomo.com
  tags:
