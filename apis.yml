apis:
- aid: wow-momo:wow-momo-content-api
  name: WOW! Momo Content API
  description: >-
    The live WordPress REST API served by www.wowmomo.com, advertised in the head of every page as
    <link rel="https://api.w.org/">. Its route-discovery document declares 396 routes across 36
    namespaces; the core wp/v2 content collections read anonymously with no credential at all — pages
    (6 published), media (98 items), categories (5), tags (15), the author record, the post-type,
    taxonomy and status registries, and the site search index (7 objects, 0 posts). The oEmbed 1.0
    provider endpoint and the Yoast SEO head document also answer anonymously. Settings, menus,
    plugins, themes, block types, abilities and the Contact Form 7 namespace all return 401 or 403.
  image: https://www.wowmomo.com/wp-content/uploads/2022/03/Wow-Momo-Logo.png
  humanURL: https://www.wowmomo.com/wp-json/
  baseURL: https://www.wowmomo.com/wp-json
  tags:
