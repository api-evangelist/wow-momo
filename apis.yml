aid: wow-momo
name: WOW! Momo
description: >-
  WOW! Momo Foods Private Limited is the Kolkata, India quick-service restaurant company founded in
  August 2008 by St. Xavier's College alumni Sagar J. Daryani and Binod K. Homagai, which built a
  national chain around the momo and now operates three brands — WOW! Momo, WOW! China and WOW!
  Chicken (launched December 2021) — across roughly 650 outlets in more than 30 Indian cities, backed
  by Lighthouse Funds, Tiger Global, Khazanah Nasional and Oaks Capital. WOW! Momo runs no developer
  programme: it publishes no API documentation, developer portal, SDK, API pricing or support channel,
  and no company-authored OpenAPI, AsyncAPI or GraphQL contract exists anywhere public. It is
  catalogued here because www.wowmomo.com serves a live, anonymously readable WordPress REST API —
  advertised in the head of every page as <link rel="https://api.w.org/"> — exposing the site's pages,
  media library, taxonomies, search index, oEmbed 1.0 provider endpoint and Yoast SEO head document,
  alongside a separate first-party application backend on api.wowmomo.com that answers every anonymous
  request, including a control path that cannot exist, with an identical NO_AUTH body.
image: https://www.wowmomo.com/wp-content/uploads/2022/03/Wow-Momo-Logo.png
