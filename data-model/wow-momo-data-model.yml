relationships:
- from: Page
  to: Author
  type: belongs_to
  via: author
  note: Integer author id; resolvable with ?_embed=1, confirmed live.
- from: Page
  to: MediaItem
  type: belongs_to
  via: featured_media
  note: Integer media id; 0 means none.
- from: Page
  to: Page
  type: belongs_to
  via: parent
  note: Pages are hierarchical on this install (types/page declares hierarchical true).
- from: MediaItem
  to: Page
  type: belongs_to
  via: post
  note: The object the attachment was uploaded to; may be null.
- from: MediaItem
  to: Author
  type: belongs_to
  via: author
- from: Category
  to: Category
  type: belongs_to
  via: parent
  note: The category taxonomy is hierarchical; the tag taxonomy is not.
- from: PostType
  to: Taxonomy
  type: has_many
  via: taxonomies
- from: Taxonomy
  to: PostType
  type: has_many
  via: types
- from: SearchResult
  to: Page
  type: has_one
  via: id + subtype
  note: >-
    Resolve a result by fetching the collection named by its subtype (page, elementor_library) with the
    returned id.
absent:
  note: >-
    There is no menu, store, outlet, product, nutrition or order entity anywhere on this surface. The
    store locator lives on a vendor-operated microsite (restaurants.wowmomo.com) and the ordering domain
    lives behind the api.wowmomo.com NO_AUTH gate, so neither contributes an entity here. A reader
    looking for WOW! Momo's menu or outlet data will not find it in this graph.
