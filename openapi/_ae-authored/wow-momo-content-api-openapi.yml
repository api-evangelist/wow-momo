  /wp/v2/search:
    get:
      operationId: listSearchResults
      summary: List search
      description: Search across every public post type on www.wowmomo.com and return lightweight result objects (id, title,
        url, type, subtype). Seven objects were indexed at capture.
      tags:
      - Search
      parameters:
      - name: context
        in: query
        description: Scope under which the request is made; determines fields present in response.
        schema:
          type: string
          enum:
          - view
          - embed
          default: view
      - name: exclude
        in: query
        description: Ensure result set excludes specific IDs.
        schema:
          type: array
          default: []
          items:
            type: integer
      - name: include
        in: query
        description: Limit result set to specific IDs.
        schema:
          type: array
          default: []
          items:
            type: integer
      - name: page
        in: query
        description: Current page of the collection.
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: per_page
        in: query
        description: Maximum number of items to be returned in result set.
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
      - name: search
        in: query
        description: Limit results to those matching a string.
        schema:
          type: string
      - name: subtype
        in: query
        description: Limit results to items of one or more object subtypes.
        schema:
          type: array
          default: any
          items:
            enum:
            - post
            - page
            - elementor_library
            - category
            - post_tag
            - any
            type: string
      - name: type
        in: query
        description: Limit results to items of an object type.
        schema:
          type: string
          enum:
          - post
          - term
          - post-format
          default: post
      responses:
        '200':
          description: A collection of search.
          headers:
            X-WP-Total:
              description: Total number of matching records.
              schema:
                type: integer
            X-WP-TotalPages:
              description: Total number of pages available at the current per_page size.
              schema:
                type: integer
            Allow:
              description: Methods available to the caller. Anonymous callers observe `GET`.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchResult'
        '400': *id001
  /yoast/v1/get_head:
    get:
      operationId: getSeoHead
      summary: Get the rendered SEO head for a wowmomo.com URL
      description: Return the Yoast SEO plugin's rendered <head> block for a URL on www.wowmomo.com — title, canonical, robots
        directives, Open Graph and Twitter card tags, and the schema.org JSON-LD graph (Organization, WebSite, WebPage, BreadcrumbList)
        — as both an HTML string and a parsed JSON object. Verified anonymously readable on 2026-09-04; every other yoast/v1
        route on this install is an administrative route and returns 401.
      tags:
      - SEO
      parameters:
      - name: url
        in: query
        required: true
        description: The wowmomo.com URL to retrieve the SEO head for.
        schema:
          type: string
          format: uri
      responses:
        '200':
          description: The rendered SEO head.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  html:
                    type: string
                    description: The rendered <head> markup.
                  json:
                    type: object
                    additionalProperties: true
                    description: The same head parsed into an object, including the schema.org @graph.
        '404': *id001
